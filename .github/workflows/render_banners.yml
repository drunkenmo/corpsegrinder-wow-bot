name: Warcraft-Banner als PNG erzeugen

on:
  push:
    branches: [main]
    paths:
      - 'assets/*.svg'
      - '.github/workflows/render_banners.yml'

permissions:
  contents: write

concurrency:
  group: corpsegrinder-banners-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SVG-Banner rasterisieren
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for path in sorted(Path('assets').glob('*.svg')):
              dest = path.with_suffix('.png')
              cairosvg.svg2png(url=str(path), write_to=str(dest),
                               output_width=1200, output_height=360)
              print(f'Gerendert: {dest}')
          PY
      - name: Erstellte Banner nach main übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png
          if git diff --cached --quiet; then
            echo "Banner unverändert."
          else
            git commit -m "Render illustrated Corpsegrinder banners"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
