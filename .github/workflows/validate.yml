name: Bot-Code prüfen
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Syntax prüfen
        run: python -m compileall -q corpsegrinder_wow_bot
      - name: Home-Assistant-YAML prüfen
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          for path in (
              'repository.yaml',
              'corpsegrinder_wow_bot/config.yaml',
              'corpsegrinder_wow_bot/build.yaml',
          ):
              with open(path, encoding='utf-8') as f:
                  obj = yaml.safe_load(f)
              assert isinstance(obj, dict), path
              print(f'OK: {path}')
          PY
      - name: Offline-Updater-Tests
        run: python -m unittest discover -s tests -v

      - name: Temporärer Live-Probelauf für offizielle Addon-Icons
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          for slug in ("blackthornes-farmer", "questie"):
              url = "https://api.cfwidget.com/wow/addons/" + slug
              try:
                  req = Request(url, headers={"User-Agent": "CorpsegrinderAddons/1.0", "Accept": "application/json"})
                  with urlopen(req, timeout=12) as resp:
                      payload = json.loads(resp.read(350001))
                  print(slug, "id=", payload.get("id"), "game=", payload.get("game"),
                        "thumbnail=", str(payload.get("thumbnail"))[:200],
                        "files=", len(payload.get("files") or []))
              except Exception as exc:
                  print(slug, type(exc).__name__, str(exc)[:150])
          PY
