name: Bot-Code prüfen
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discord-Bibliothek für echte Layout-Tests installieren
        run: python -m pip install discord.py==2.6.4
      - name: Hold-My-Beer-Banner als PNG prüfen
        run: |
          python -m pip install CairoSVG==2.7.1
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          cairosvg.svg2png(
              url="assets/hold_my_beer.svg",
              write_to="assets/hold_my_beer.png",
              output_width=1280, output_height=320)
          assert Path("assets/hold_my_beer.png").stat().st_size > 10000
          print("HMB-Banner erfolgreich erstellt.")
          PY
      - name: Python-Syntax prüfen
        run: python -m compileall -q corpsegrinder_wow_bot
      - name: Home-Assistant-YAML prüfen
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          for path in (
              'repository.yaml',
              'corpsegrinder_wow_bot/config.yaml',
              'corpsegrinder_wow_bot/build.yaml',
          ):
              with open(path, encoding='utf-8') as f:
                  obj = yaml.safe_load(f)
              assert isinstance(obj, dict), path
              print(f'OK: {path}')
          PY
      - name: Offline-Updater-Tests
        run: python -m unittest discover -s tests -v
