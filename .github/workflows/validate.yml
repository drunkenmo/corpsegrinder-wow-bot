name: Bot-Code prüfen
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Syntax prüfen
        run: python -m compileall -q corpsegrinder_wow_bot
      - name: Home-Assistant-YAML prüfen
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          for path in (
              'repository.yaml',
              'corpsegrinder_wow_bot/config.yaml',
              'corpsegrinder_wow_bot/build.yaml',
          ):
              with open(path, encoding='utf-8') as f:
                  obj = yaml.safe_load(f)
              assert isinstance(obj, dict), path
              print(f'OK: {path}')
          PY
