name: Bot-Code prüfen
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Syntax prüfen
        run: python -m compileall -q corpsegrinder_wow_bot
      - name: Home-Assistant-YAML prüfen
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          for path in (
              'repository.yaml',
              'corpsegrinder_wow_bot/config.yaml',
              'corpsegrinder_wow_bot/build.yaml',
          ):
              with open(path, encoding='utf-8') as f:
                  obj = yaml.safe_load(f)
              assert isinstance(obj, dict), path
              print(f'OK: {path}')
          PY
      - name: Offline-Updater-Tests
        run: python -m unittest discover -s tests -v



      - name: Temporärer Live-Abgleich aller 19 CurseForge-Projekte
        continue-on-error: true
        run: |
          python - <<'PY'
          import html, re
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor
          slugs = ("blackthornes-farmer", "blackthornes-tradeskills", "blackthornes-equipment",
                   "blackthornes-butler", "blackthornes-pets", "factoruide-guide",
                   "factoruide-profile", "azerothcompendium", "sktools",
                   "spoken", "spoken-german", "questie", "questforever",
                   "leatrix-plus", "leatrix-maps", "auctionator", "baganator",
                   "tomtom", "deadly-boss-mods")
          def check(slug):
              try:
                  req=Request("https://www.curseforge.com/wow/addons/"+slug,headers={
                      "User-Agent":"Mozilla/5.0 (compatible; CorpsegrinderAddons/1.0)",
                      "Accept":"text/html,application/xhtml+xml"})
                  with urlopen(req, timeout=12) as resp: source=resp.read(500000).decode("utf-8","replace")
                  visible=re.sub(r"<[^>]*>", " ", html.unescape(source))
                  visible=re.sub(r"\s+"," ",visible)
                  id_match=re.search(r"Project ID\s+(\d+)",visible,re.I)
                  og_match=re.search(r'<meta\s+property="og:image"\s+content="([^"]+)"',source,re.I)
                  return (slug, id_match.group(1) if id_match else "?", (og_match.group(1)[:125] if og_match else "?"))
              except Exception as exc:
                  return (slug,"ERR",str(exc)[:90])
          with ThreadPoolExecutor(max_workers=3) as pool:
              for slug, number, icon in pool.map(check,slugs):
                  print(slug, "|", number, "|",icon)
          PY
