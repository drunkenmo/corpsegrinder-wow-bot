name: Bot-Code prüfen und Update veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - 'corpsegrinder_wow_bot/bot.py'
      - 'corpsegrinder_wow_bot/community_features.py'
      - 'assets/hold_my_beer.svg'
      - '.github/workflows/publish_bot_update.yml'

permissions:
  contents: read

concurrency:
  group: corpsegrinder-release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aktuellen Repository-Stand übernehmen
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Discord-Bibliothek für echte Layout-Tests installieren
        run: python -m pip install discord.py==2.6.4
      - name: Python-Syntax prüfen
        run: python -m compileall -q corpsegrinder_wow_bot
      - name: Tests ausführen
        run: python -m unittest discover -s tests -v
      - name: Prüfbares Versionsmanifest erzeugen
        run: python scripts/publish_manifest.py
      - name: Manifest veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_releases/latest.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Publish verified Corpsegrinder bot release"
            # Der separate Banner-Workflow kann kurz zuvor ein PNG pushen.
            # Rebase verhindert einen Konflikt um den Git-Branch-Zeiger.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
